name: Publish

# 打 tag（v1.0.0 等）时自动发布到 npm；需要在仓库 Secrets 里配置 NPM_TOKEN
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mochi-island-ui test
      - run: pnpm --filter mochi-island-ui build
      - run: pnpm --filter mochi-island-ui publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
